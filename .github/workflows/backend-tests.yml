name: Backend security regressions
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest httpx fastapi python-dotenv PyJWT bcrypt requests numpy==2.5.3 langchain-core==1.6.3
      - run: python -m pytest tests -q
        working-directory: backend
