name: Backend security regressions
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest httpx fastapi python-dotenv PyJWT bcrypt requests numpy==2.5.3 langchain-core==1.6.3
      - run: python -m pytest tests -q
        working-directory: backend
